# Mem-build APK debug di setiap push, lalu mengunggahnya sebagai artifact "apk-debug".
# Unduh dari tab Actions -> pilih run -> bagian Artifacts.
name: Build APK debug

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner GitHub sudah punya Android SDK; langkah ini hanya menerima lisensinya.
      # Platform yang kurang (misalnya compileSdk 37) diunduh otomatis oleh Gradle.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      # Firebase (push ke HP PMO) opsional. Bila secret GOOGLE_SERVICES_JSON ada,
      # isinya ditulis ke app/google-services.json (file ini tidak pernah masuk git).
      - name: Siapkan google-services.json dari secret (bila ada)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase: aktif (dari secret)"
          else
            echo "Firebase: tidak aktif (secret GOOGLE_SERVICES_JSON belum dibuat)"
          fi

      - name: Tes unit
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Menulis jumlah tes lulus/gagal per kelas ke log dan ke halaman ringkasan run.
      - name: Ringkasan tes
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          if not files:
              print("Tidak ada hasil tes.")
              raise SystemExit
          print("| Kelas tes | Jumlah | Gagal | Dilewati |")
          print("|---|---|---|---|")
          total = gagal = lewat = 0
          for f in files:
              s = ET.parse(f).getroot()
              t, g, l = int(s.get("tests")), int(s.get("failures")) + int(s.get("errors")), int(s.get("skipped"))
              total, gagal, lewat = total + t, gagal + g, lewat + l
              print(f"| {s.get('name').split('.')[-1]} | {t} | {g} | {l} |")
          print(f"| **Total** | **{total}** | **{gagal}** | **{lewat}** |")
          PY

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unggah laporan tes (bila gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes
          path: app/build/reports/tests/
          if-no-files-found: ignore
